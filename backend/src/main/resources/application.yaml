# Configuración base. Los valores sensibles llegan por variables de entorno.
# NUNCA escribir credenciales reales en este archivo.

spring:
  application:
    name: fieldflow-api

  datasource:
    # El proveedor es Supabase (PostgreSQL gestionado). Ver ADR-0004.
    # Los valores reales viven en backend/.env, que no entra al repositorio.
    # El default apunta al Postgres de docker-compose para que el proyecto
    # siga arrancando en local sin .env.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fieldflow}
    username: ${DB_USER:fieldflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: fieldflow-pool
      maximum-pool-size: ${DB_POOL_SIZE:5}       # los planes gratuitos limitan conexiones
      minimum-idle: ${DB_POOL_MIN_IDLE:1}        # no sostener conexiones ociosas contra el pooler
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:15000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      # El pooler de Supabase corta las conexiones ociosas por su cuenta. Si Hikari
      # las recicla primero, el usuario nunca ve el "connection closed" del primer
      # request después de un rato sin tráfico. keepalive < idle-timeout < max-lifetime.
      keepalive-time: ${DB_KEEPALIVE_MS:120000}      # 2 min
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}     # 5 min
      max-lifetime: ${DB_MAX_LIFETIME_MS:600000}     # 10 min

  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo maneja Flyway, nunca Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    # Se puede apagar con FLYWAY_ENABLED=false para probar solo la conectividad
    # contra una base compartida, sin aplicar migraciones desde tu máquina.
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: ${DB_SCHEMA:public}

  jackson:
    default-property-inclusion: always
    datatype:
      datetime:
        # Jackson 3 (el que trae Spring Boot 4) movió esta opción de
        # SerializationFeature a DateTimeFeature. No devolverla a
        # "serialization:": el arranque falla.
        # Fechas en ISO-8601 con zona, nunca epoch (ver CLAUDE.md).
        write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  web:
    error:
      include-message: never

server:
  port: ${PORT:8080}

app:
  openapi:
    # URL pública del backend de staging (despliegue) para el selector de
    # servidores de Swagger UI. Si está vacía solo se publica el local.
    staging-url: ${OPENAPI_STAGING_URL:localhost:8080}
  cors:
    # Lista separada por comas. Nunca "*": la API envía credenciales.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    frontend-url: ${FRONTEND_URL:}
  db-status:
    # GET /api/v1/db-status. En true agrega host, usuario y estado del pool:
    # util en local, información de infraestructura de más en un endpoint público.
    # Ponerlo en "false" en staging mientras Spring Security siga desactivada.
    show-details: ${DB_STATUS_DETAILS:true}
  security:
    jwt-secret: ${JWT_SECRET:} # obligatorio en producción

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.fieldflow: DEBUG